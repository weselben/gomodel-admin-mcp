name: release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - bun.lock
      - Dockerfile
      - tsconfig.json
      - README.md
      - tests/**
      - .github/**

permissions:
  contents: write
  packages: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: bun install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: lint
        run: bun run lint

      - name: test
        run: bun test

      # Refresh the measured tools/list token table in README.md so the
      # version commit below carries up-to-date numbers.
      - name: measure token table
        run: bun run measure-tokens

      - name: compute new tag
        id: semantic
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      # Land the version on main BEFORE the tag exists, so main already
      # houses the version that the release, image, and tag will carry.
      # "[skip ci]" in the commit message stops this push from re-firing
      # the workflow (it only touches package.json, which is a watched path).
      - name: commit version to main
        id: version_commit
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${NEW_TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          git config user.name "release-ci"
          git config user.email "actions@github.com"
          git commit -am "chore(release): $NEW_TAG [skip ci]"
          # GITHUB_TOKEN pushes are blocked by the main ruleset, and personal
          # repos cannot add GitHub Actions as a bypass actor. Push as the
          # owner instead (Admin role is on the bypass list).
          git push "https://x-access-token:${RELEASE_PAT}@github.com/weselben/gomodel-admin-mcp.git" HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: tag release commit
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: create release
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.semantic.outputs.new_tag }}
          generate_release_notes: true
          name: Release ${{ steps.semantic.outputs.new_tag }}

      - name: set up docker buildx
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: login to ghcr
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/weselben/gomodel-admin-mcp:${{ steps.semantic.outputs.new_tag }}
            ghcr.io/weselben/gomodel-admin-mcp:latest
            ghcr.io/weselben/gomodel-admin-mcp:${{ steps.version_commit.outputs.sha }}
