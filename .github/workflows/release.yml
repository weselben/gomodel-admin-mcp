name: release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - bun.lock
      - Dockerfile
      - tsconfig.json
      - README.md
      - .github/**

permissions:
  contents: write
  packages: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: lint
        run: bun run lint

      # Refresh the measured tools/list token table in README.md so the
      # version commit below carries up-to-date numbers.
      - name: measure token table
        run: bun run measure-tokens

      - name: compute new tag
        id: semantic
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      # Land the version on main BEFORE the tag exists, so main already
      # houses the version that the release, image, and tag will carry.
      # "[skip ci]" in the commit message stops this push from re-firing
      # the workflow (it only touches package.json, which is a watched path).
      - name: commit version to main
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          git config user.name "release-ci"
          git config user.email "actions@github.com"
          git commit -am "chore(release): $NEW_TAG [skip ci]"
          git push origin HEAD:main

      - name: tag release commit
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: create release
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic.outputs.new_tag }}
          generate_release_notes: true
          name: Release ${{ steps.semantic.outputs.new_tag }}

      - name: set up docker buildx
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/weselben/gomodel-admin-mcp:${{ steps.semantic.outputs.new_tag }}
            ghcr.io/weselben/gomodel-admin-mcp:latest
            ghcr.io/weselben/gomodel-admin-mcp:${{ github.sha }}
