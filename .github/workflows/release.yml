name: release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - bun.lock
      - Dockerfile
      - tsconfig.json
      - README.md
      - CLAUDE.md
      - tests/**
      - .github/**
  # Manual finalize/redo path: dispatches on main, finalizing whatever
  # tag the state implies.
  workflow_dispatch:

# Release runs mutate tags and images; serialize them so overlapping
# merges cannot race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: bun install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: lint
        run: bun run lint

      - name: test
        run: bun test

      # Refresh the measured tools/list token table in README.md so the
      # version commit below carries up-to-date numbers.
      - name: measure token table
        run: bun run measure-tokens

      - name: compute new tag
        id: semantic
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v
          dry_run: true

      # Two modes, decided by the head commit subject:
      # - a merged "chore(release): vX.Y.Z" PR -> finalize: tag the merge
      #   commit, publish the GitHub Release, push the image.
      # - any other merge -> the version bump travels through an
      #   auto-merged release PR. The main ruleset requires PRs, and
      #   personal repos cannot add GitHub Actions as a bypass actor, so
      #   direct GITHUB_TOKEN pushes to main are impossible by design.
      - name: detect release mode
        id: mode
        if: ${{ steps.semantic.outputs.new_tag != steps.semantic.outputs.previous_tag }}
        run: |
          if git log -1 --format=%s | grep -q '^chore(release):'; then
            echo "mode=finalize" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: open release PR
        id: release_pr
        if: ${{ steps.mode.outputs.mode == 'pr' }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
          PREV_TAG: ${{ steps.semantic.outputs.previous_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="release/$NEW_TAG"
          VERSION="${NEW_TAG#v}"
          npm version "$VERSION" --no-git-tag-version \
            || echo "package.json already at $VERSION"
          git config user.name "release-ci"
          git config user.email "actions@github.com"
          git commit -am "chore(release): $NEW_TAG" \
            || echo "version already set — nothing to commit"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "version already on main — finalizing directly"
            echo "mode=finalize" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -f origin "HEAD:$BRANCH"
          # Release-notes preview: commits since the previous tag, at the
          # state this PR was (last) refreshed. Every watched-path merge
          # re-fires this step, so an open release PR's body stays current
          # with main — nothing goes stale while it waits.
          {
            echo "## Release notes preview — $NEW_TAG"
            echo ""
            echo "_Snapshot of main at the last refresh; the published notes are regenerated at release time._"
            echo ""
            if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" > /dev/null; then
              git log --pretty=format:"- %s" "refs/tags/$PREV_TAG..origin/main"
            else
              git log --pretty=format:"- %s" origin/main
            fi
            echo ""
            echo ""
            echo "**Merging this PR is the release trigger** — the merge fires the finalize run (tag, GitHub Release, GHCR image). Close it to skip the release; the next watched merge re-opens it with a refreshed preview."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): $NEW_TAG" \
            --body-file /tmp/pr-body.md \
            || gh pr edit "$BRANCH" \
              --title "chore(release): $NEW_TAG" \
              --body-file /tmp/pr-body.md
          # Releases are human-gated: nothing auto-merges. The owner
          # merges the release PR; that merge is a real push event by a
          # bypass-listed user, so the event-driven finalize run fires.

      - name: tag release commit
        if: ${{ steps.mode.outputs.mode == 'finalize' || steps.release_pr.outputs.mode == 'finalize' }}
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_tag }}
        run: |
          # Replace an existing tag so a re-run can always complete the
          # release, whatever state a previous attempt left behind.
          git tag -f "$NEW_TAG"
          git push -f origin "$NEW_TAG"

      - name: create release
        if: ${{ steps.mode.outputs.mode == 'finalize' || steps.release_pr.outputs.mode == 'finalize' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.semantic.outputs.new_tag }}
          generate_release_notes: true
          name: Release ${{ steps.semantic.outputs.new_tag }}

      - name: set up docker buildx
        if: ${{ steps.mode.outputs.mode == 'finalize' || steps.release_pr.outputs.mode == 'finalize' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: login to ghcr
        if: ${{ steps.mode.outputs.mode == 'finalize' || steps.release_pr.outputs.mode == 'finalize' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker
        if: ${{ steps.mode.outputs.mode == 'finalize' || steps.release_pr.outputs.mode == 'finalize' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/weselben/gomodel-admin-mcp:${{ steps.semantic.outputs.new_tag }}
            ghcr.io/weselben/gomodel-admin-mcp:latest
            ghcr.io/weselben/gomodel-admin-mcp:${{ github.sha }}
