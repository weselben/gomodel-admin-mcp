name: swagger-update

on:
  schedule:
    # Daily 06:00 UTC — pulls the latest gomodel admin API surface into
    # a human-reviewed PR.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      gomodel_ref:
        description: gomodel ref to regenerate against (branch, tag, or SHA)
        required: false
        default: main

# Multiple sources may trigger this at once; serialize to avoid
# duplicate PRs racing.
concurrency:
  group: swagger-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: checkout gomodel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ENTERPILOT/GoModel
          ref: ${{ inputs.gomodel_ref || 'main' }}
          path: gomodel
          fetch-depth: 1

      - name: record gomodel SHA
        id: gomsha
        run: |
          SHA="$(git -C gomodel rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gomodel/go.mod
          cache: false

      - name: generate swagger.json (swag init)
        # Same invocation gomodel's own Makefile uses (the module pins
        # swag v2.0.0-rc5 in go.mod, so no version is needed here). We
        # keep the 2.0 output — their target converts 2.0 -> 3.0 for the
        # website; we feed 2.0 straight into our regenerator.
        run: |
          cd gomodel
          go run github.com/swaggo/swag/v2/cmd/swag init \
            --generalInfo main.go \
            --dir cmd/gomodel,internal \
            --output "$GITHUB_WORKSPACE/_swagout" \
            --outputTypes json \
            --parseDependency \
            --quiet

      - name: regenerate admin swagger spec
        run: |
          node scripts/regenerate-admin-swagger.mjs \
            _swagout/swagger.json _new-admin-swagger.json

      # The gate runs here rather than trusting ci.yml on the PR: that
      # run DID fire on the last spec PR and DID go red — the `main`
      # ruleset ("Block Direct Push to main", id 23570187) requires a PR
      # and a Copilot review but lists no required status checks, so a
      # failing ci.yml never blocked the merge. Run the gate inside the
      # job that authors the branch, where a failure stops this run.

      - name: diff against current spec
        id: diff
        run: |
          if cmp -s _new-admin-swagger.json spec/admin-swagger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "spec is already up to date for gomodel ${{ steps.gomsha.outputs.short }}"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("node:fs");
            const a = JSON.parse(fs.readFileSync("spec/admin-swagger.json", "utf8"));
            const b = JSON.parse(fs.readFileSync("_new-admin-swagger.json", "utf8"));
            const ak = new Set(Object.keys(a.paths)), bk = new Set(Object.keys(b.paths));
            const ad = new Set(Object.keys(a.definitions)), bd = new Set(Object.keys(b.definitions));
            console.log("paths_old=" + ak.size);
            console.log("paths_new=" + bk.size);
            console.log("paths_added=" + [...bk].filter(p => !ak.has(p)).length);
            console.log("paths_removed=" + [...ak].filter(p => !bk.has(p)).length);
            console.log("defs_old=" + ad.size);
            console.log("defs_new=" + bd.size);
            console.log("added_paths=" + [...bk].filter(p => !ak.has(p)).join(", "));
            console.log("removed_paths=" + [...ak].filter(p => !bk.has(p)).join(", "));
          ' | tee -a "$GITHUB_OUTPUT"

      # Runs against a scratch copy of the tracked spec, so the diff above
      # and the commit in "open PR" both still see a pristine
      # spec/admin-swagger.json. Gated on a real change: a no-op day never
      # pays for bun install + build + test.
      - name: setup bun
        if: steps.diff.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: validate regenerated spec against the test suite
        id: gate
        if: steps.diff.outputs.changed == 'true'
        # Non-fatal: the PR still opens so Ben sees the diff, but the run
        # ends red when the gate fails or never runs (see the final step).
        continue-on-error: true
        run: |
          cp spec/admin-swagger.json /tmp/spec-backup.json
          cp _new-admin-swagger.json spec/admin-swagger.json
          bun install --frozen-lockfile
          bun run build
          if bun test; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          # Always restore, so the later commit sees the pristine tracked spec.
          cp /tmp/spec-backup.json spec/admin-swagger.json

      # The PR body is assembled into a file (one indented echo per line)
      # instead of a heredoc: heredoc content must start at column 0,
      # which would break out of this YAML block scalar and corrupt the
      # workflow file. That exact bug fired this workflow on every push.
      - name: open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOMODEL_SHA: ${{ steps.gomsha.outputs.sha }}
          GOMODEL_SHORT: ${{ steps.gomsha.outputs.short }}
          PATHS_OLD: ${{ steps.diff.outputs.paths_old }}
          PATHS_NEW: ${{ steps.diff.outputs.paths_new }}
          ADDED_COUNT: ${{ steps.diff.outputs.paths_added }}
          REMOVED_COUNT: ${{ steps.diff.outputs.paths_removed }}
          ADDED_PATHS: ${{ steps.diff.outputs.added_paths }}
          REMOVED_PATHS: ${{ steps.diff.outputs.removed_paths }}
        run: |

          BRANCH="chore/swagger-update-${GOMODEL_SHORT}"
          {
            echo "Automated regeneration of spec/admin-swagger.json from upstream [ENTERPILOT/GoModel](https://github.com/ENTERPILOT/GoModel) commit ${GOMODEL_SHA}."
            echo ""
            echo "|  | paths |"
            echo "|---|---|"
            echo "| before | ${PATHS_OLD} |"
            echo "| after | ${PATHS_NEW} |"
            echo ""
            echo "Added paths: ${ADDED_COUNT} — ${ADDED_PATHS}"
            echo ""
            echo "Removed paths: ${REMOVED_COUNT} — ${REMOVED_PATHS}"
            echo ""
            echo "spec/gomodel-source.txt records the gomodel commit and generation time. This workflow is human-gated — nothing auto-merges."
            echo ""
            echo "Merging this PR does not fire a release flow (spec/** is not a watched path). Add spec/** to the release workflow's paths filter if spec bumps should ship a release."
          } > /tmp/pr-body.md
          git config user.name "release-ci"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH" origin/main
          cp _new-admin-swagger.json spec/admin-swagger.json
          printf 'gomodel_commit: %s\ngenerated_at: %s\n' \
            "$GOMODEL_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > spec/gomodel-source.txt
          git add spec/admin-swagger.json spec/gomodel-source.txt
          if git diff --cached --quiet; then
            echo "no spec changes after staging"
            exit 0
          fi
          git commit -m "chore: update admin swagger spec from gomodel $GOMODEL_SHORT"

          # Check if there's an open swagger-update PR. If so, update it
          # instead of creating a new one. This prevents PR pile-up.
          EXISTING_PR=$(gh pr list --state open --search "chore: update admin swagger spec" --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Found existing PR #$EXISTING_PR. Updating it..."
            git push -f origin "$BRANCH"
            gh pr edit "$EXISTING_PR" \
              --title "chore: update admin swagger spec from gomodel $GOMODEL_SHORT" \
              --body-file /tmp/pr-body.md
          else
            echo "No existing swagger PR. Creating new one..."
            git push -f origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update admin swagger spec from gomodel $GOMODEL_SHORT" \
              --body-file /tmp/pr-body.md
          fi

      - name: up-to-date summary
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "spec/admin-swagger.json already matches gomodel ${{ steps.gomsha.outputs.sha }} — no PR needed."

      - name: fail on spec-vs-src contradiction
        # `!= 'true'` (not `== 'false'`) so an unset/crashed gate — bun
        # install or tsc blowing up before the suite ran — also fails here.
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.passed != 'true'
        run: |
          echo "::error::Regenerated spec does not validate against src/ (gate did not report passed=true). Either a new spec path has no matching MCP tool, or query parameters drifted and the tool/signature no longer matches the spec. Read the failing test output in this run's 'validate regenerated spec against the test suite' step, then adopt the new endpoint in src/ (or revert the spec) before merging — the coverage sweep would otherwise stay red on main."
          exit 1

