name: swagger-update

on:
  schedule:
    # Daily 06:00 UTC — pulls the latest gomodel admin API surface into
    # a human-reviewed PR.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      gomodel_ref:
        description: gomodel ref to regenerate against (branch, tag, or SHA)
        required: false
        default: main

# Multiple sources may trigger this at once; serialize to avoid
# duplicate PRs racing.
concurrency:
  group: swagger-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout gomodel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ENTERPILOT/GoModel
          ref: ${{ inputs.gomodel_ref || 'main' }}
          path: gomodel
          fetch-depth: 1

      - name: record gomodel SHA
        id: gomsha
        run: |
          SHA="$(git -C gomodel rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: gomodel/go.mod
          cache: false

      - name: generate swagger.json (swag init)
        # Same invocation gomodel's own Makefile uses (the module pins
        # swag v2.0.0-rc5 in go.mod, so no version is needed here). We
        # keep the 2.0 output — their target converts 2.0 -> 3.0 for the
        # website; we feed 2.0 straight into our regenerator.
        run: |
          cd gomodel
          go run github.com/swaggo/swag/v2/cmd/swag init \
            --generalInfo main.go \
            --dir cmd/gomodel,internal \
            --output "$GITHUB_WORKSPACE/_swagout" \
            --outputTypes json \
            --parseDependency \
            --quiet

      - name: regenerate admin swagger spec
        run: |
          bun scripts/regenerate-admin-swagger.mjs \
            _swagout/swagger.json _new-admin-swagger.json

      - name: checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: this
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: diff against current spec
        id: diff
        run: |
          if cmp -s _new-admin-swagger.json this/spec/admin-swagger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "spec is already up to date for gomodel ${{ steps.gomsha.outputs.short }}"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          bun -e '
            const a = JSON.parse(await Bun.file("this/spec/admin-swagger.json").text());
            const b = JSON.parse(await Bun.file("_new-admin-swagger.json").text());
            const ak = new Set(Object.keys(a.paths)), bk = new Set(Object.keys(b.paths));
            const ad = new Set(Object.keys(a.definitions)), bd = new Set(Object.keys(b.definitions));
            console.log("paths_old=" + ak.size);
            console.log("paths_new=" + bk.size);
            console.log("paths_added=" + [...bk].filter(p => !ak.has(p)).length);
            console.log("paths_removed=" + [...ak].filter(p => !bk.has(p)).length);
            console.log("defs_old=" + ad.size);
            console.log("defs_new=" + bd.size);
            console.log("added_paths=" + [...bk].filter(p => !ak.has(p)).join(", "));
            console.log("removed_paths=" + [...ak].filter(p => !bk.has(p)).join(", "));
          ' | tee -a "$GITHUB_OUTPUT"

      # The PR body is assembled into a file (one indented echo per line)
      # instead of a heredoc: heredoc content must start at column 0,
      # which would break out of this YAML block scalar and corrupt the
      # workflow file. That exact bug fired this workflow on every push.
      - name: open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOMODEL_SHA: ${{ steps.gomsha.outputs.sha }}
          GOMODEL_SHORT: ${{ steps.gomsha.outputs.short }}
          PATHS_OLD: ${{ steps.diff.outputs.paths_old }}
          PATHS_NEW: ${{ steps.diff.outputs.paths_new }}
          ADDED_COUNT: ${{ steps.diff.outputs.paths_added }}
          REMOVED_COUNT: ${{ steps.diff.outputs.paths_removed }}
          ADDED_PATHS: ${{ steps.diff.outputs.added_paths }}
          REMOVED_PATHS: ${{ steps.diff.outputs.removed_paths }}
        run: |
          cd this
          BRANCH="chore/swagger-update-${GOMODEL_SHORT}"
          {
            echo "Automated regeneration of spec/admin-swagger.json from upstream [ENTERPILOT/GoModel](https://github.com/ENTERPILOT/GoModel) commit ${GOMODEL_SHA}."
            echo ""
            echo "|  | paths |"
            echo "|---|---|"
            echo "| before | ${PATHS_OLD} |"
            echo "| after | ${PATHS_NEW} |"
            echo ""
            echo "Added paths: ${ADDED_COUNT} — ${ADDED_PATHS}"
            echo ""
            echo "Removed paths: ${REMOVED_COUNT} — ${REMOVED_PATHS}"
            echo ""
            echo "spec/gomodel-source.txt records the gomodel commit and generation time. This workflow is human-gated — nothing auto-merges."
            echo ""
            echo "Merging this PR does not fire a release flow (spec/** is not a watched path). Add spec/** to the release workflow's paths filter if spec bumps should ship a release."
          } > /tmp/pr-body.md
          git config user.name "release-ci"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH" origin/main
          cp ../_new-admin-swagger.json spec/admin-swagger.json
          printf 'gomodel_commit: %s\ngenerated_at: %s\n' \
            "$GOMODEL_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > spec/gomodel-source.txt
          git add spec/admin-swagger.json spec/gomodel-source.txt
          if git diff --cached --quiet; then
            echo "no spec changes after staging"
            exit 0
          fi
          git commit -m "chore: update admin swagger spec from gomodel $GOMODEL_SHORT"
          git push -f origin "$BRANCH"
          # Release policy: nothing auto-merges. Human review/merge is the gate.
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update admin swagger spec from gomodel $GOMODEL_SHORT" \
            --body-file /tmp/pr-body.md

      - name: up-to-date summary
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "spec/admin-swagger.json already matches gomodel ${{ steps.gomsha.outputs.sha }} — no PR needed."
